{% extends "base.html" %}

{% block content %}
<div class="card">
    <h3>Data Collection Setup</h3>
    
    <div class="grid grid-2">
        <div class="form-group">
            <label for="session-date">Session Date</label>
            <input type="date" id="session-date" value="{{ today }}">
        </div>
        
        <div class="form-group">
            <label for="student-multiselect">Select Students (1-4)</label>
            <select id="student-multiselect" multiple size="6">
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.first_name }}</option>
                {% endfor %}
            </select>
            <small style="color: #666; font-size: 0.9rem;">Hold Ctrl/Cmd to select multiple students</small>
        </div>
    </div>
    
    <button class="btn btn-success" onclick="loadSelectedStudents()">Load Selected Students</button>
</div>

<div id="student-cards" style="margin-top: 1rem;">
    <!-- Student cards will be loaded here -->
</div>

{% if not students %}
<div class="card text-center">
    <p style="color: #666; padding: 2rem;">No students found. Please add students and objectives first.</p>
    <a href="/students" class="btn">Go to Students & Objectives</a>
</div>
{% endif %}
{% endblock %}

{% block scripts %}
<script>
    let selectedStudents = [];
    let sessionDate = '{{ today }}';
    
    // Update session date when changed
    document.getElementById('session-date').addEventListener('change', function() {
        sessionDate = this.value;
        // Reload student cards to get counts for new date
        if (selectedStudents.length > 0) {
            loadSelectedStudents();
        }
    });
    
    function loadSelectedStudents() {
        const select = document.getElementById('student-multiselect');
        const selectedOptions = Array.from(select.selectedOptions);
        
        if (selectedOptions.length === 0) {
            showMessage('Please select at least one student', 'error');
            return;
        }
        
        if (selectedOptions.length > 4) {
            showMessage('Please select no more than 4 students', 'error');
            return;
        }
        
        selectedStudents = selectedOptions.map(option => ({
            id: option.value,
            name: option.text
        }));
        
        sessionDate = document.getElementById('session-date').value;
        
        renderStudentCards();
        showMessage(`Loaded ${selectedStudents.length} student(s) for ${sessionDate}`);
    }
    
    async function renderStudentCards() {
        const container = document.getElementById('student-cards');
        container.innerHTML = '';
        
        const studentsData = {{ students | tojson }};
        
        for (const selectedStudent of selectedStudents) {
            const studentData = studentsData.find(s => s.id == selectedStudent.id);
            
            if (!studentData || !studentData.objectives || studentData.objectives.length === 0) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${selectedStudent.name}</h3>
                    <p style="color: #666; text-align: center; padding: 1rem;">No objectives found for this student.</p>
                `;
                container.appendChild(card);
                continue;
            }
            
            const card = document.createElement('div');
            card.className = 'card';
            
            let cardContent = `<h3>${selectedStudent.name}</h3><div class="objectives-list" style="display: grid; gap: 1rem;">`;
            
            // Process each objective and load its items
            for (const objective of studentData.objectives) {
                const items = await loadObjectiveItemsForCollection(objective.id);
                
                cardContent += `
                    <div class="objective-section" style="border: 1px solid #e1e5e9; border-radius: 12px; background: #f8f9fa;">
                        <div class="objective-header" 
                             style="padding: 1rem; background: #e9ecef; border-radius: 12px 12px 0 0; cursor: pointer;"
                             onclick="toggleObjectiveSection(${selectedStudent.id}, ${objective.id})">
                            <div style="display: flex; justify-content: between; align-items: center;">
                                <div style="flex: 1;">
                                    <div style="font-weight: 600; font-size: 1rem; margin-bottom: 0.25rem;">${objective.text}</div>
                                    <div style="font-size: 0.85rem; color: #666;">
                                        <span id="selected-count-${selectedStudent.id}-${objective.id}">0</span> items selected
                                    </div>
                                </div>
                                <div style="font-size: 1.2rem; font-weight: bold; color: #666;" id="toggle-icon-${selectedStudent.id}-${objective.id}">▼</div>
                            </div>
                        </div>
                        
                        <div class="objective-content" id="content-${selectedStudent.id}-${objective.id}" 
                             style="display: none; padding: 1rem; border-top: 1px solid #ddd;">
                            
                            <!-- Activity and Prompt Controls -->
                            <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                                <div style="flex: 1; min-width: 150px;">
                                    <label style="display: block; margin-bottom: 0.25rem; font-weight: 600; font-size: 0.9rem;">Activity</label>
                                    <input type="text" id="activity-${selectedStudent.id}-${objective.id}" 
                                           placeholder="Enter activity..." 
                                           style="width: 100%; padding: 8px; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 6px;">
                                </div>
                                <div style="min-width: 120px;">
                                    <label style="display: block; margin-bottom: 0.25rem; font-weight: 600; font-size: 0.9rem;">Prompt Level</label>
                                    <select id="prompt-${selectedStudent.id}-${objective.id}" 
                                            style="width: 100%; padding: 8px; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 6px;">
                                        <option value="">Select...</option>
                                        <option value="I">Independent</option>
                                        <option value="V">Verbal</option>
                                        <option value="G">Gestural</option>
                                        <option value="P">Physical</option>
                                        <option value="M">Max Support</option>
                                    </select>
                                </div>
                            </div>
                            
                            <!-- Items Checklist -->
                            <div class="items-checklist" id="items-${selectedStudent.id}-${objective.id}">
                                ${items.length > 0 ? `
                                    <label style="display: block; margin-bottom: 0.75rem; font-weight: 600; font-size: 0.9rem;">Select completed items:</label>
                                    <div style="display: grid; gap: 0.5rem;">
                                        ${items.map(item => `
                                            <label style="display: flex; align-items: center; padding: 0.5rem; background: white; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; transition: background-color 0.2s;">
                                                <input type="checkbox" 
                                                       id="item-${selectedStudent.id}-${objective.id}-${item.id}"
                                                       value="${item.id}"
                                                       style="margin-right: 0.75rem; transform: scale(1.2);"
                                                       onchange="handleItemSelection(${selectedStudent.id}, ${objective.id}, ${item.id})">
                                                <span style="font-size: 0.95rem;">${item.text}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                ` : `
                                    <div style="text-align: center; color: #666; padding: 2rem; font-style: italic;">
                                        No items configured for this objective.<br>
                                        <a href="/students" style="color: #007bff;">Add items in Students & Objectives</a>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            cardContent += `</div>
                <div class="notes-section" style="margin-top: 1rem;">
                    <label for="notes-${selectedStudent.id}" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Session Notes</label>
                    <textarea id="notes-${selectedStudent.id}" 
                              placeholder="Optional notes for this session..."
                              style="min-height: 80px;"
                              onblur="saveNotes(${selectedStudent.id})"></textarea>
                </div>
            `;
            
            card.innerHTML = cardContent;
            container.appendChild(card);
        }
        
        // Load existing selections for this date
        await loadExistingSelections();
    }
    
    async function loadObjectiveItemsForCollection(objectiveId) {
        try {
            const response = await fetch(`/objective_items/get/${objectiveId}`);
            const result = await response.json();
            return result.items || [];
        } catch (error) {
            console.error('Error loading objective items:', error);
            return [];
        }
    }
    
    function toggleObjectiveSection(studentId, objectiveId) {
        const content = document.getElementById(`content-${studentId}-${objectiveId}`);
        const icon = document.getElementById(`toggle-icon-${studentId}-${objectiveId}`);
        
        if (content.style.display === 'none') {
            content.style.display = 'block';
            icon.textContent = '▲';
        } else {
            content.style.display = 'none';
            icon.textContent = '▼';
        }
    }
    
    async function handleItemSelection(studentId, objectiveId, itemId) {
        const checkbox = document.getElementById(`item-${studentId}-${objectiveId}-${itemId}`);
        const activityInput = document.getElementById(`activity-${studentId}-${objectiveId}`);
        const promptSelect = document.getElementById(`prompt-${studentId}-${objectiveId}`);
        
        const activity = activityInput ? activityInput.value.trim() : '';
        const promptLevel = promptSelect ? promptSelect.value : '';
        
        try {
            const response = await fetch('/event/toggle_item_selection', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    date: sessionDate,
                    student_id: studentId,
                    objective_id: objectiveId,
                    item_id: itemId,
                    selected: checkbox.checked,
                    activity: activity,
                    prompt_level: promptLevel
                })
            });
            
            const result = await response.json();
            
            if (!result.success) {
                // Revert checkbox state if server request failed
                checkbox.checked = !checkbox.checked;
                showMessage(result.error || 'Failed to update selection', 'error');
            } else {
                // Update the selection count display
                updateSelectionCount(studentId, objectiveId);
                
                // Show brief success feedback
                if (checkbox.checked) {
                    showMessage('Item selected', 'success', 1000);
                }
            }
        } catch (error) {
            console.error('Error updating item selection:', error);
            // Revert checkbox state on error
            checkbox.checked = !checkbox.checked;
            showMessage('Failed to update selection', 'error');
        }
    }
    
    function updateSelectionCount(studentId, objectiveId) {
        const checkboxes = document.querySelectorAll(`input[id^="item-${studentId}-${objectiveId}-"]:checked`);
        const countElement = document.getElementById(`selected-count-${studentId}-${objectiveId}`);
        if (countElement) {
            countElement.textContent = checkboxes.length;
        }
    }
    
    async function loadExistingSelections() {
        if (selectedStudents.length === 0) return;
        
        try {
            const params = new URLSearchParams();
            params.append('date', sessionDate);
            selectedStudents.forEach(student => {
                params.append('student_id', student.id);
            });
            
            const response = await fetch(`/event/selections?${params.toString()}`);
            const result = await response.json();
            
            if (result.selections) {
                // Update checkbox states
                Object.entries(result.selections).forEach(([key, selections]) => {
                    const [studentId, objectiveId] = key.split('-');
                    selections.forEach(itemId => {
                        const checkbox = document.getElementById(`item-${studentId}-${objectiveId}-${itemId}`);
                        if (checkbox) {
                            checkbox.checked = true;
                        }
                    });
                    // Update count display
                    updateSelectionCount(studentId, objectiveId);
                });
            }
            
            if (result.activities) {
                // Update activity inputs
                Object.entries(result.activities).forEach(([key, activity]) => {
                    const activityInput = document.getElementById(`activity-${key}`);
                    if (activityInput) {
                        activityInput.value = activity;
                    }
                });
            }
            
            if (result.prompt_levels) {
                // Update prompt level selects
                Object.entries(result.prompt_levels).forEach(([key, promptLevel]) => {
                    const promptSelect = document.getElementById(`prompt-${key}`);
                    if (promptSelect) {
                        promptSelect.value = promptLevel;
                    }
                });
            }
            
            if (result.notes) {
                // Update notes textareas
                Object.entries(result.notes).forEach(([studentId, notes]) => {
                    const notesElement = document.getElementById(`notes-${studentId}`);
                    if (notesElement) {
                        notesElement.value = notes;
                    }
                });
            }
        } catch (error) {
            console.error('Error loading existing selections:', error);
        }
    }
    
    async function loadExistingCounts() {
        if (selectedStudents.length === 0) return;
        
        try {
            const params = new URLSearchParams();
            params.append('date', sessionDate);
            selectedStudents.forEach(student => {
                params.append('student_id', student.id);
            });
            
            const response = await fetch(`/event/counts?${params.toString()}`);
            const result = await response.json();
            
            if (result.counts) {
                // Update count displays
                Object.entries(result.counts).forEach(([key, count]) => {
                    const countElement = document.getElementById(`count-${key}`);
                    if (countElement) {
                        countElement.textContent = count;
                    }
                });
            }
            
            if (result.notes) {
                // Update notes textareas
                Object.entries(result.notes).forEach(([studentId, notes]) => {
                    const notesElement = document.getElementById(`notes-${studentId}`);
                    if (notesElement) {
                        notesElement.value = notes;
                    }
                });
            }
        } catch (error) {
            console.error('Error loading existing counts:', error);
        }
    }
    
    async function incrementCount(studentId, objectiveId, btn) {
        const countElement = document.getElementById(`count-${studentId}-${objectiveId}`);
        const activityInput = document.getElementById(`activity-${studentId}-${objectiveId}`);
        const promptSelect = document.getElementById(`prompt-${studentId}-${objectiveId}`);
        
        const activity = activityInput ? activityInput.value.trim() : '';
        const promptLevel = promptSelect ? promptSelect.value : '';
        
        setLoading(btn, true);
        
        try {
            const response = await fetch('/event/increment', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    date: sessionDate,
                    student_id: studentId,
                    objective_id: objectiveId,
                    activity: activity,
                    prompt_level: promptLevel
                })
            });
            
            const result = await response.json();
            
            if (result.count !== undefined) {
                countElement.textContent = result.count;
                // Brief visual feedback
                countElement.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    countElement.style.transform = 'scale(1)';
                }, 150);
            } else {
                showMessage(result.error || 'Failed to increment count', 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            showMessage('Failed to increment count', 'error');
        } finally {
            setLoading(btn, false);
        }
    }
    
    async function decrementCount(studentId, objectiveId, btn) {
        const countElement = document.getElementById(`count-${studentId}-${objectiveId}`);
        const currentCount = parseInt(countElement.textContent);
        
        if (currentCount <= 0) {
            return; // Can't go below 0
        }
        setLoading(btn, true);
        
        try {
            const response = await fetch('/event/decrement', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    date: sessionDate,
                    student_id: studentId,
                    objective_id: objectiveId
                })
            });
            
            const result = await response.json();
            
            if (result.count !== undefined) {
                countElement.textContent = result.count;
                // Brief visual feedback
                countElement.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    countElement.style.transform = 'scale(1)';
                }, 150);
            } else {
                showMessage(result.error || 'Failed to decrement count', 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            showMessage('Failed to decrement count', 'error');
        } finally {
            setLoading(btn, false);
        }
    }
    
    async function saveNotes(studentId) {
        const notesTextarea = document.getElementById(`notes-${studentId}`);
        const notes = notesTextarea.value.trim();
        
        try {
            const response = await fetch('/event/save_notes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    date: sessionDate,
                    student_id: studentId,
                    notes: notes
                })
            });
            
            const result = await response.json();
            
            if (!result.success) {
                showMessage(result.error || 'Failed to save notes', 'error');
            }
            // Don't show success message for notes as it would be too frequent
        } catch (error) {
            console.error('Error saving notes:', error);
        }
    }
    
    // Add touch and hold for decrement button
    let touchTimer;
    
    document.addEventListener('DOMContentLoaded', function() {
        // Add touch events for better mobile interaction
        document.addEventListener('touchstart', function(e) {
            if (e.target.classList.contains('decrement-btn')) {
                touchTimer = setTimeout(() => {
                    // Long press detected
                    e.target.style.background = '#c0392b';
                    // Could trigger decrement here if desired
                }, 500);
            }
        });
        
        document.addEventListener('touchend', function(e) {
            if (touchTimer) {
                clearTimeout(touchTimer);
                if (e.target.classList.contains('decrement-btn')) {
                    e.target.style.background = '';
                }
            }
        });
        
        // Prevent zoom on double-tap for buttons
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = new Date().getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    });
</script>
{% endblock %}
