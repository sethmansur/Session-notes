<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Collection Sheet - {{ session_date }}</title>
    <style>
        /* Print-optimized CSS */
        @page {
            size: letter portrait;
            margin: 0.25in;
        }

        @media print {
            .no-print { display: none !important; }
            body { -webkit-print-color-adjust: exact; color-adjust: exact; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 10px;
            line-height: 1.1;
            color: #000;
            background: white;
        }

        .page {
            width: 8in; /* 8.5" - 0.5" margins */
            height: auto; /* Let content determine height */
            /* Narrow margins for maximum space usage */
        }

        /* Header Section */
        .header {
            border-bottom: 2px solid #000;
            padding-bottom: 0.25in;
            margin-bottom: 0.25in;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 14px;
            font-weight: bold;
        }

        .header-info {
            text-align: right;
            font-size: 9px;
        }

        .header-fields {
            display: flex;
            gap: 1in;
            margin-top: 0.1in;
        }

        .header-field {
            display: flex;
            align-items: center;
            gap: 0.1in;
        }

        .header-field input {
            border: none;
            border-bottom: 1px solid #000;
            width: 1.5in;
            padding: 2px;
            font-size: 11px;
        }

        /* Student Grid - 1x4 layout for 4 students */
        .students-grid {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: repeat(4, 1fr);
            gap: 0.06in;
            height: auto;
        }

        /* Individual Student Panel - Expanded */
        .student-panel {
            border: 2px solid #000;
            padding: 0.06in;
            break-inside: avoid;
            font-size: 8px;
            height: auto;
            max-height: 2.4in;
        }

        .student-name {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            padding: 0.04in;
            border-bottom: 2px solid #000;
            margin-bottom: 0.08in;
            background: #f0f0f0;
        }

        .objectives-list {
            display: flex;
            flex-direction: column;
            gap: 0.05in;
        }

        .objective-row {
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.03in;
            margin-bottom: 0.03in;
            min-height: 0.4in;
        }

        .objective-text {
            flex: 1;
            font-size: 8px;
            padding-right: 0.05in;
            line-height: 1.1;
            word-wrap: break-word;
            max-width: calc(100% - 1.2in); /* Reserve space for larger box */
        }

        /* Single Count Box per objective - Maximized for handwriting */
        .count-box {
            width: 1.0in;
            height: 0.7in;
            border: 2px solid #000;
            display: inline-block;
            background: white;
            margin-left: 0.05in;
        }

        /* Notes area - Compact */
        .notes-area {
            margin-top: 0.05in;
            border-top: 1px solid #ccc;
            padding-top: 0.02in;
        }

        .notes-label {
            font-size: 6px;
            font-weight: bold;
            margin-bottom: 0.02in;
        }

        .notes-lines {
            display: flex;
            flex-direction: column;
            gap: 0.03in;
        }

        .notes-line {
            border-bottom: 1px solid #ddd;
            height: 0.06in;
        }

        /* Screen-only controls */
        .controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 5px;
        }

        .btn:hover {
            background: #0056b3;
        }

        /* Ensure 1x4 grid layout for print */
        @media print {
            .students-grid {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Screen controls -->
    <div class="controls no-print">
        <button class="btn" onclick="window.print()">🖨️ Print Sheet</button>
        <button class="btn" onclick="window.close()">✖️ Close</button>
    </div>

    <div class="page">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>Speech Therapy Data Collection</h1>
                <div class="header-fields">
                    <div class="header-field">
                        <label>Date:</label>
                        <input type="text" value="{{ session_date }}" readonly>
                    </div>
                    <div class="header-field">
                        <label>Therapist:</label>
                        <input type="text" value="{{ therapist_name }}">
                    </div>
                    <div class="header-field">
                        <label>Session:</label>
                        <input type="text">
                    </div>
                </div>
            </div>
            <div class="header-info">
                <div><strong>{{ organization_name }}</strong></div>
                <div>All Students - Single Page</div>
            </div>
        </div>

        <!-- Students Grid -->
        <div class="students-grid">
            {% for student in pages[0] %}
            <div class="student-panel">
                <div class="student-name">{{ student.first_name }}</div>
                
                <div class="objectives-list">
                    {% for objective in student.objectives %}
                    <div class="objective-row">
                        <div class="objective-text" title="{{ objective.objective_text }}">
                            {{ objective.objective_text }}
                        </div>
                        <div class="count-box"></div>
                    </div>
                    {% endfor %}
                    
                </div>
                
                <!-- Notes area - Reduced to 2 lines -->
                <div class="notes-area">
                    <div class="notes-label">Notes:</div>
                    <div class="notes-lines">
                        <div class="notes-line"></div>
                        <div class="notes-line"></div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Auto-print on load (optional) -->
    <script>
        // Auto-open print dialog after page loads
        window.addEventListener('load', function() {
            // Give page time to render before printing
            setTimeout(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('auto_print') === 'true') {
                    window.print();
                }
            }, 1000); // Increased delay for better reliability
        });
    </script>
</body>
</html>
