<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Error - SessionNotes</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }
        .error-container {
            background: white;
            max-width: 500px;
            margin: 4rem auto;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #dc3545;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            display: inline-block;
        }
        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>🚫 Authentication Error</h1>
        <p>Sorry, there was a problem signing you in. This could be due to:</p>
        <ul style="text-align: left; color: #666;">
            <li>Network connectivity issues</li>
            <li>Authentication session timeout</li>
            <li>Account access restrictions</li>
        </ul>
        <p>Please try signing in again.</p>
        <a href="/" class="btn">← Back to Home</a>
    </div>
</body>
</html>
